name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - 'docs/**'
      - '**.md'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Optional Docker Hub publishing. Kept in job-level env because the `secrets`
    # context is not allowed inside a step `if:` — forks without these secrets
    # then skip the login instead of failing the whole build.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    


    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Pushes to 'main' or stable releases get tagged :latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && !contains(github.ref_name, 'dev') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'rc')) }}
            # Pushes to 'dev' or dev pre-releases get tagged :dev
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' || (github.ref_type == 'tag' && (contains(github.ref_name, 'dev') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc'))) }}
            # Git releases get tagged with their version numbers (e.g., :v1.0.0, :1.0)
            type=semver,pattern={{version}}
            # Every push gets a unique commit SHA tag (e.g., :sha-7f3b1a2)
            type=sha,prefix=sha-

      - name: Write version code
        run: |
          REF_NAME="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            CLEAN_VER="${REF_NAME#v}"
            case "$REF_NAME" in
              *dev*|*beta*|*alpha*|*rc*) BRANCH="dev" ;;
              *) BRANCH="main" ;;
            esac
          else
            CLEAN_VER="0.${{ github.run_number }}"
            BRANCH="${REF_NAME}"
          fi

          cat <<EOF > web/version.json
          {
            "version": "$CLEAN_VER",
            "tag": "$REF_NAME",
            "run_number": ${{ github.run_number }},
            "branch": "$BRANCH",
            "commit": "${{ github.sha }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat web/version.json

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max