# ==============================================================================
# UPSTREAM BUILT-IN APP SOURCES (AutoMorph Defaults)
# ==============================================================================
# These sources ship with AutoMorph and are automatically updated with new releases.
# To override settings or add private/custom apps, create or edit:
#   tools/automorph-data/custom_sources.yaml (or app_sources.yaml)
# Custom configurations automatically overlay on top of these defaults at runtime.
#
# Want to contribute a source upstream? Open an issue/ticket on GitHub and we will
# add it to the default list if appropriate!
# ==============================================================================

# Infinity+
ml.docilealligator.infinityforreddit.plus:
  type: github
  version: most_recent
  repo: Docile-Alligator/Infinity-For-Reddit
  # Regex to isolate the target asset from the release assets list
  asset_pattern: '^Infinity\+-v.*\.apk$'  
  # Fallback/matching arch: universal, arm64-v8a, etc.
  arch: 

# Infinity Patreon
ml.docilealligator.infinityforreddit.patreon:
  type: github
  version: most_recent
  repo: Docile-Alligator/Infinity-For-Reddit
  # Regex to isolate the target asset from the release assets list
  asset_pattern: '^Infinity-Patreon-v.*\.apk$'  
  # Fallback/matching arch: universal, arm64-v8a, etc.
  arch: 

# AAEnabler
com.aaenabler.app:
  type: github
  repo: malebuffy/AAEnabler
  asset_pattern: 'AAEnabler-v.*\.apk$'
  version: most_recent # v1.0.12 does not exist on github anymore

# Anilili
com.miruronative:
  type: discord
  url: https://discord.com/invite/m3HtAZeQH5 / https://github.com/kompoti121/anilili # download from discord

# Monet-Launcher
com.klevico.monet:
